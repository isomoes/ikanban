name: Release and Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node --input-type=module - "$VERSION" <<'NODE'
          import { readFile } from 'node:fs/promises'

          const expected = process.argv[2]
          const manifests = await Promise.all([
            readFile('packages/web-ui/package.json', 'utf8').then(JSON.parse),
            readFile('packages/ikanban/package.json', 'utf8').then(JSON.parse),
          ])
          for (const manifest of manifests) {
            if (manifest.version !== expected) {
              throw new Error(`${manifest.name} is ${manifest.version}; release tag requires ${expected}`)
            }
          }
          const sharedRange = manifests[1].dependencies['@isomoes/dsh-web-ui']
          if (sharedRange !== `workspace:${expected}`) {
            throw new Error(`@isomoes/dsh-ikanban must pin workspace:${expected}, found ${sharedRange}`)
          }
          NODE

      - name: Pack shared Web UI artifact
        run: pnpm --filter @isomoes/dsh-web-ui pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Pack iKanban artifact
        run: pnpm --filter @isomoes/dsh-ikanban pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Upload npm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/*.tgz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Publish packages to npm
        shell: bash
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN

          shopt -s nullglob
          web_ui=(dist/isomoes-dsh-web-ui-*.tgz)
          ikanban=(dist/isomoes-dsh-ikanban-*.tgz)

          if [ "${#web_ui[@]}" -ne 1 ] || [ "${#ikanban[@]}" -ne 1 ]; then
            echo "Expected exactly one dsh-web-ui tarball and one dsh-ikanban tarball"
            printf 'web-ui: %s\n' "${web_ui[@]:-<none>}"
            printf 'ikanban: %s\n' "${ikanban[@]:-<none>}"
            exit 1
          fi

          # Product packages pin this exact shared version, so publish it first.
          npm publish "./${web_ui[0]}" --provenance
          npm publish "./${ikanban[0]}" --provenance

  create-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/

      - name: Extract tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from changelog
        run: |
          TAG_NAME="${{ steps.tag.outputs.TAG_NAME }}"
          VERSION="${TAG_NAME#v}"

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release notes for ${TAG_NAME} were not found in CHANGELOG.md" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: dist/*.tgz
